name: engines

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Le pool de moteurs residents s'eprouve sans GPU, avec un faux moteur. C'est
  # rapide, et ca evite de decouvrir une regression apres un build d'image qui
  # telecharge plusieurs gigaoctets de poids.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Volontairement pas tout `requirements.txt` : `vastai` ne sert qu'au
      # proxy PyWorker, que les tests n'importent pas. L'installer ici ferait
      # dependre le build d'image d'une dependance etrangere au test.
      - name: Dependances
        run: pip install "fastapi>=0.115,<0.120" "httpx>=0.27,<1" pytest

      - name: Tests du serveur de modele
        working-directory: engines/qwen3_tts
        run: |
          chmod +x tests/fake_qwen.py
          python -m pytest tests -q

  image:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # L image porte trois jeux de poids 1.7B : le runner manque de place
      # sans un menage serieux, et le build casserait tard, apres les
      # telechargements.
      - name: Liberer de l espace
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: engines/qwen3_tts
          file: engines/qwen3_tts/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/abo-qwen3-tts:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/abo-qwen3-tts:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/abo-qwen3-tts:latest
